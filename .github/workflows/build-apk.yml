name: Build Android APK

# Otomatik APK derleme iş akışı (yalnızca Debug).
#
# Ne zaman çalışır?
#   - main branch'ine her push yapıldığında
#   - main'e açılan her pull request'te
#   - Actions sekmesinden "Run workflow" ile manuel olarak
#
# Ne üretir?
#   - piram-debug APK -> Her zaman. Sır (secret) gerektirmez, cihaza kurulabilir.
#
# Not: Bu proje native Kotlin/Android'dir (Gradle). Bun/Capacitor adımları yoktur;
# CI yapısı (Java 21, setup-android, APK yeniden adlandırma, artifact isimlendirme)
# Capacitor tabanlı iş akışıyla uyumlu hale getirilmiştir.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & upload debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts içindeki debugConfig imzalama yapılandırması
      # kökte bir debug.keystore bekler; yoksa burada oluşturuyoruz.
      - name: Create debug keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/piram-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: piram-APK
          path: artifacts/piram-debug.apk
          if-no-files-found: error
